<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICE HAND｜服務滿意度調查</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Arial,sans-serif;background:radial-gradient(circle at top,#263554 0%,#111827 38%,#070b12 100%);color:#f5f5f5;min-height:100vh}.container{width:92%;max-width:680px;margin:auto;padding:36px 0 70px}.header{text-align:center;margin-bottom:26px}.brand{color:#d7b56d;font-size:15px;letter-spacing:5px;font-weight:700;margin-bottom:10px}h1{margin:0;font-size:30px;font-weight:800}.subtitle{margin-top:12px;color:#aeb8c8;line-height:1.7;font-size:14px}.card{background:rgba(255,255,255,.97);color:#18202b;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 15px 45px rgba(0,0,0,.25)}.card-title{font-size:19px;font-weight:800;margin-bottom:8px}.card-note{color:#737d8c;font-size:13px;margin-bottom:15px;line-height:1.6}.item{padding:17px 0;border-bottom:1px solid #e8ebf0}.item:last-child{border-bottom:none;padding-bottom:2px}.item-title{font-size:15px;font-weight:700;margin-bottom:9px}.stars{display:flex;gap:8px}.star{border:0;background:none;font-size:35px;color:#d5d8dd;cursor:pointer;padding:0;line-height:1.2}.star.active{color:#d2a84c}.reason,input,textarea{width:100%;border:1px solid #d8dde5;border-radius:10px;padding:12px;font-size:16px;background:#fff;color:#202733;outline:none;font-family:inherit}.reason{margin-top:12px;min-height:66px;resize:vertical}.reason:focus,input:focus,textarea:focus{border-color:#b89752;box-shadow:0 0 0 3px rgba(184,151,82,.12)}label{display:block;font-size:14px;font-weight:700;margin:18px 0 8px}textarea{min-height:100px;resize:vertical}.submit{width:100%;border:0;border-radius:12px;padding:16px;margin-top:8px;font-size:17px;font-weight:800;color:#15191f;background:linear-gradient(135deg,#f2db9b,#c99f45);cursor:pointer}.submit:disabled{opacity:.55;cursor:not-allowed}.privacy{text-align:center;color:#929dad;font-size:12px;line-height:1.8;margin-top:18px}#message{display:none;margin-top:16px;padding:13px;border-radius:10px;font-size:14px;line-height:1.6}.success{display:block!important;background:#eaf8ef;color:#17663a}.error{display:block!important;background:#fff0f0;color:#a12d2d}.footer{text-align:center;margin-top:30px;color:#727d8c;font-size:12px;letter-spacing:1px}.required{color:#a77820;font-size:12px;font-weight:400}@media(max-width:520px){.container{width:94%;padding-top:26px}.card{padding:20px}h1{font-size:25px}.star{font-size:33px}}
</style>
</head>
<body>
<div class="container">
<header class="header"><div class="brand">NICE HAND</div><h1>服務滿意度調查</h1><div class="subtitle">您的意見，是我們持續進步的重要依據。<br>感謝您花一點時間給我們最真實的回饋。</div></header>
<section class="card"><div class="card-title">整體滿意度</div><div class="card-note">請依照本次的實際體驗給予評分</div><div class="item"><div class="item-title">本次服務整體滿意度 <span class="required">（必填）</span></div><div class="stars" data-field="overall_rating"></div></div></section>
<section class="card"><div class="card-title">一、服務品質</div><div class="card-note">請依照實際接觸經驗評分；未接觸的項目可略過。</div><div id="serviceItems"></div></section>
<section class="card"><div class="card-title">二、環境與整潔</div><div class="card-note">請依照現場環境的實際感受給予評分。</div><div id="environmentItems"></div></section>
<section class="card"><div class="card-title">三、員工服務表現</div><div class="card-note">可直接填寫員工姓名或暱稱，不必從名單選取。</div><label for="favorite_employee_name">本次服務中，是否有讓您特別感到親切、值得肯定的員工？</label><input id="favorite_employee_name" maxlength="50" placeholder="員工姓名或暱稱（選填）"><textarea class="reason" id="favorite_employee_reason" maxlength="500" placeholder="讓您印象深刻的原因（選填）"></textarea><label for="improve_employee_name">是否有您認為服務態度或表現需要加強的員工？</label><input id="improve_employee_name" maxlength="50" placeholder="員工姓名或暱稱（選填）"><textarea class="reason" id="improve_employee_reason" maxlength="500" placeholder="您認為需要改善的原因（選填）"></textarea></section>
<section class="card"><div class="card-title">四、其他建議</div><div class="card-note">如果還有其他想法，歡迎告訴我們。</div><textarea id="improvement_comment" maxlength="500" placeholder="請輸入您的建議（選填）"></textarea></section>
<section class="card"><button class="submit" id="submitBtn" type="button">送出評價</button><div id="message" role="status" aria-live="polite"></div><div class="privacy">本問卷不要求填寫會員姓名。<br>每台裝置原則上 30 天可填寫一次。<br>評價資料僅供 NICE HAND 內部服務品質改善使用。</div></section>
<div class="footer">NICE HAND SERVICE REVIEW</div>
</div>
<script>
const SUPABASE_URL="https://hssaupoqeqaxpqglfzea.supabase.co";
const SUPABASE_KEY="sb_publishable_AgzsUiJbiaV-6jrzth4ODw_nQvXJKM4";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const REVIEW_STORAGE_KEY="nice_hand_last_review";
const REVIEW_LIMIT_DAYS=30;
const fields=[
{group:"serviceItems",rating:"counter_rating",reason:"counter_reason",title:"櫃檯人員的接待與服務態度"},
{group:"serviceItems",rating:"floor_rating",reason:"floor_reason",title:"場控人員的協助與應對"},
{group:"serviceItems",rating:"staff_rating",reason:"staff_reason",title:"其他服務人員的整體表現"},
{group:"environmentItems",rating:"environment_rating",reason:"environment_reason",title:"現場環境與舒適度"},
{group:"environmentItems",rating:"tablecloth_rating",reason:"tablecloth_reason",title:"牌桌桌布的清潔程度"},
{group:"environmentItems",rating:"chips_rating",reason:"chips_reason",title:"計分牌的清潔程度"},
{group:"environmentItems",rating:"restroom_rating",reason:"restroom_reason",title:"廁所的環境與整潔程度"}
];
const ratings={overall_rating:0};
function addStars(element,field){for(let i=1;i<=5;i++){const button=document.createElement("button");button.type="button";button.className="star";button.textContent="★";button.setAttribute("aria-label",`${i} 顆星`);button.setAttribute("aria-pressed","false");button.addEventListener("click",()=>{ratings[field]=i;element.querySelectorAll(".star").forEach((b,index)=>{const active=index<i;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active));});});element.appendChild(button);}}
addStars(document.querySelector('[data-field="overall_rating"]'),"overall_rating");
fields.forEach(item=>{const box=document.createElement("div");box.className="item";const title=document.createElement("div");title.className="item-title";title.textContent=item.title;const stars=document.createElement("div");stars.className="stars";addStars(stars,item.rating);const reason=document.createElement("textarea");reason.className="reason";reason.id=item.reason;reason.maxLength=500;reason.placeholder="原因或建議（選填）";box.append(title,stars,reason);document.getElementById(item.group).appendChild(box);});
function showMessage(message,type){const el=document.getElementById("message");el.textContent=message;el.className=type;el.scrollIntoView({behavior:"smooth",block:"nearest"});}
function checkReviewLimit(){try{const last=Number(localStorage.getItem(REVIEW_STORAGE_KEY));return Number.isFinite(last)&&last>0&&Date.now()-last<REVIEW_LIMIT_DAYS*86400000;}catch{return false;}}
function value(id){return document.getElementById(id).value.trim()||null;}
const submitBtn=document.getElementById("submitBtn");
if(checkReviewLimit()){submitBtn.disabled=true;submitBtn.textContent="30 天內已完成評價";showMessage("感謝您的回饋！本裝置近期已完成服務評價，每 30 天可填寫一次。","error");}
submitBtn.addEventListener("click",async()=>{
if(checkReviewLimit()){showMessage("本裝置近期已完成服務評價，每 30 天可填寫一次。","error");return;}
if(!ratings.overall_rating){showMessage("請先選擇整體滿意度星等。","error");return;}
submitBtn.disabled=true;submitBtn.textContent="送出中…";
const payload={overall_rating:ratings.overall_rating,improvement_comment:value("improvement_comment"),favorite_employee_name:value("favorite_employee_name"),favorite_employee_reason:value("favorite_employee_reason"),improve_employee_name:value("improve_employee_name"),improve_employee_reason:value("improve_employee_reason")};
fields.forEach(item=>{payload[item.rating]=ratings[item.rating]||null;payload[item.reason]=value(item.reason);});
try{const {error}=await client.from("reviews").insert([payload]);if(error)throw error;try{localStorage.setItem(REVIEW_STORAGE_KEY,String(Date.now()));}catch(e){console.warn("無法儲存本機填寫紀錄",e);}showMessage("感謝您的回饋，評價已成功送出！","success");submitBtn.textContent="評價已送出";}catch(error){console.error(error);showMessage("送出失敗，請稍後再試。","error");submitBtn.disabled=false;submitBtn.textContent="送出評價";}
});
</script>
</body>
</html>
