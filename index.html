<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NICE HAND｜服務滿意度調查</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Microsoft JhengHei",
        Arial, sans-serif;

      background:
        radial-gradient(circle at top, #263554 0%, #111827 38%, #070b12 100%);
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 680px;
      margin: 0 auto;
      padding: 36px 0 70px;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand {
      color: #d7b56d;
      font-size: 15px;
      letter-spacing: 5px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 12px;
      color: #aeb8c8;
      line-height: 1.7;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,0.97);
      color: #18202b;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .card-note {
      color: #737d8c;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 17px 0 8px;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #d8dde5;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      background: white;
      color: #202733;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #b89752;
      box-shadow: 0 0 0 3px rgba(184,151,82,0.12);
    }

    textarea {
      min-height: 115px;
      resize: vertical;
    }

    .stars {
      display: flex;
      gap: 7px;
      margin-top: 6px;
    }

    .star {
      border: none;
      background: none;
      font-size: 37px;
      color: #d5d8dd;
      cursor: pointer;
      padding: 0;
      transition: 0.15s;
    }

    .star.active {
      color: #d2a84c;
    }

    .star:hover {
      transform: scale(1.08);
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 8px;
      font-size: 17px;
      font-weight: 800;
      color: #15191f;
      background: linear-gradient(135deg,#f2db9b,#c99f45);
      cursor: pointer;
    }

    .submit:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .privacy {
      text-align: center;
      color: #929dad;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 18px;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .success {
      display: block !important;
      background: #eaf8ef;
      color: #17663a;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #a12d2d;
    }

    .loading {
      color: #7b8490;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #727d8c;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media(max-width:520px) {
      .container {
        width: 94%;
        padding-top: 26px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="brand">NICE HAND</div>
    <h1>服務滿意度調查</h1>

    <div class="subtitle">
      您的意見，是我們持續進步的重要依據。<br>
      感謝您花一點時間給我們最真實的回饋。
    </div>
  </div>


  <div class="card">

    <div class="card-title">本次服務整體滿意度</div>

    <div class="card-note">
      請依照您本次的實際體驗給予評分
    </div>

    <div class="stars" id="stars">

      <button class="star" data-value="1">★</button>
      <button class="star" data-value="2">★</button>
      <button class="star" data-value="3">★</button>
      <button class="star" data-value="4">★</button>
      <button class="star" data-value="5">★</button>

    </div>

  </div>


  <div class="card">

    <div class="card-title">員工服務評價</div>

    <div class="card-note">
      員工名單僅顯示目前在職人員
    </div>


    <label for="favorite">
      本次服務中，您最喜歡哪位員工？
    </label>

    <select id="favorite">
      <option value="">請選擇</option>
    </select>


    <label for="unfriendly">
      您認為哪位員工的服務最需要改善？
    </label>

    <select id="unfriendly">
      <option value="">沒有／不指定</option>
    </select>

  </div>


  <div class="card">

    <div class="card-title">改善建議</div>

    <div class="card-note">
      若有任何建議，都歡迎告訴我們
    </div>

    <textarea
      id="comment"
      maxlength="500"
      placeholder="請輸入您的建議（選填）"></textarea>

  </div>


  <div class="card">

    <button class="submit" id="submitBtn">
      送出評價
    </button>

    <div id="message"></div>

    <div class="privacy">
      本問卷不要求填寫姓名。<br>
      評價資料僅供 NICE HAND 內部服務品質改善使用。
    </div>

  </div>


  <div class="footer">
    NICE HAND SERVICE REVIEW
  </div>

</div>


<script>

const SUPABASE_URL =
  "https://hssaupoqeqaxpqglfzea.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AgzsUiJbiaV-6jrzth4ODw_nQvXJKM4";


const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let rating = 0;


const stars =
  document.querySelectorAll(".star");


stars.forEach(star => {

  star.addEventListener("click", () => {

    rating =
      Number(star.dataset.value);

    stars.forEach(s => {

      s.classList.toggle(
        "active",
        Number(s.dataset.value) <= rating
      );

    });

  });

});


async function loadEmployees() {

  const favorite =
    document.getElementById("favorite");

  const unfriendly =
    document.getElementById("unfriendly");


  const { data, error } =
    await client
      .from("employees")
      .select("id,name")
      .eq("is_active", true)
      .order("name");


  if (error) {

    console.error(error);

    showMessage(
      "員工名單載入失敗，請稍後再試。",
      "error"
    );

    return;

  }


  data.forEach(employee => {

    const option1 =
      document.createElement("option");

    option1.value =
      employee.id;

    option1.textContent =
      employee.name;


    const option2 =
      option1.cloneNode(true);


    favorite.appendChild(option1);

    unfriendly.appendChild(option2);

  });

}


function showMessage(text,type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className = type;

}


document
  .getElementById("submitBtn")
  .addEventListener(
    "click",
    async () => {

      const btn =
        document.getElementById("submitBtn");

      const favorite =
        document.getElementById("favorite").value;

      const unfriendly =
        document.getElementById("unfriendly").value;

      const comment =
        document.getElementById("comment").value.trim();


      if (!rating) {

        showMessage(
          "請先選擇整體滿意度星等。",
          "error"
        );

        return;

      }


      if (!favorite) {

        showMessage(
          "請選擇您最喜歡的員工。",
          "error"
        );

        return;

      }


      btn.disabled = true;

      btn.textContent =
        "送出中…";


   const payload = {
  overall_rating: rating,
  improvement_comment: comment || null
};


      const { error } =
        await client
          .from("reviews")
          .insert([payload]);


      if (error) {

        console.error(error);

        showMessage(
          "送出失敗，請稍後再試。",
          "error"
        );

        btn.disabled = false;

        btn.textContent =
          "送出評價";

        return;

      }


      showMessage(
        "感謝您的回饋，評價已成功送出。",
        "success"
      );


      rating = 0;

      stars.forEach(
        s => s.classList.remove("active")
      );


      document.getElementById("favorite").value = "";

      document.getElementById("unfriendly").value = "";

      document.getElementById("comment").value = "";


      btn.disabled = false;

      btn.textContent =
        "送出評價";

    }
  );


loadEmployees();

</script>

</body>
</html>
