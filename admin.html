<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NICE HAND｜服務評價管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Arial,sans-serif;background:#0b1322;color:#172033}.header{background:#111c31;color:#fff;padding:26px 20px}.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.header h1{margin:0 0 7px;font-size:26px}.header p{margin:0;color:#b9c3d5;font-size:14px}.container{max-width:1100px;margin:auto;padding:28px 18px 60px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.section{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px #0002}.section{margin-top:20px}.section h2{margin:0 0 12px;font-size:20px}.hint{font-size:13px;color:#687386;line-height:1.6;margin:0 0 16px}.label{color:#687386;font-size:14px;margin-bottom:10px}.number{font-size:34px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:16px;border:1px solid #e7eaf0;border-radius:12px}.metric-name{font-weight:700;margin-bottom:7px}.metric-value{font-size:23px;font-weight:700;color:#b48b35}.metric-count{font-size:12px;color:#687386;margin-top:5px}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #e7eaf0;text-align:left;vertical-align:top}th{font-size:13px;color:#687386}td{font-size:14px}.table-wrap{overflow-x:auto}.review{border:1px solid #e7eaf0;border-radius:12px;padding:16px;margin:12px 0}.review-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-weight:700}.review-date{font-weight:400;color:#8791a2;font-size:12px}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{padding:10px;background:#f7f8fa;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.answer-title{font-size:13px;font-weight:700;color:#526074;margin-bottom:5px}.answer-detail{font-size:13px;color:#526074;margin-top:6px}.status{text-align:center;color:white;padding:30px}.login-box{max-width:420px;margin:40px auto;background:#fff;padding:28px;border-radius:16px}.login-box h2{margin-top:0}.login-box p{color:#687386;font-size:14px}.login-box input{width:100%;padding:13px;margin-bottom:12px;border:1px solid #d8dde6;border-radius:8px;font-size:16px}.login-box button,.action{padding:12px 18px;border:0;border-radius:8px;background:#111c31;color:white;font-size:15px;cursor:pointer}.login-box button{width:100%}.action{background:#cda85b;color:#101a2b;font-weight:700}.login-error{color:#c62828;margin-top:12px;font-size:14px}.empty{color:#687386;padding:12px 0}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar select{padding:9px;border:1px solid #d8dde6;border-radius:8px;background:white}.pagination{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:15px}.pagination button{padding:8px 12px;border:1px solid #ccd3de;background:white;border-radius:7px;cursor:pointer}.pagination button:disabled{opacity:.45;cursor:default}@media(max-width:700px){.summary{grid-template-columns:1fr}.grid,.review-grid{grid-template-columns:1fr}.header h1{font-size:22px}.number{font-size:30px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div><h1>NICE HAND 服務評價管理後台</h1><p>會員服務滿意度統計</p></div><button id="logoutButton" class="action" style="display:none" type="button">登出</button></div></header>
<main class="container">
<div id="loginBox" class="login-box"><h2>管理員登入</h2><p>請輸入管理員帳號與密碼</p><form id="loginForm"><input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required><input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password" required><button id="loginButton" type="submit">登入管理後台</button></form><div id="loginError" class="login-error" role="alert"></div></div>
<div id="loading" class="status" style="display:none">資料讀取中...</div>
<div id="dashboard" style="display:none">
<div class="summary"><div class="card"><div class="label">有效評價總數</div><div class="number" id="totalReviews">0</div></div><div class="card"><div class="label">整體平均滿意度</div><div class="number" id="averageRating">—</div></div><div class="card"><div class="label">其他建議數</div><div class="number" id="commentCount">0</div></div></div>
<section class="section"><h2>一、服務品質</h2><p class="hint">僅統計有填寫星等的項目，未評分不計入平均。</p><div class="grid" id="serviceMetrics"></div></section>
<section class="section"><h2>二、環境整潔</h2><div class="grid" id="environmentMetrics"></div></section>
<section class="section"><h2>三、員工服務評價</h2><p class="hint">依會員自行輸入的姓名統計；相同文字會合併，暱稱或錯字可能分開計算。</p><div class="table-wrap"><table><thead><tr><th>員工姓名</th><th>服務親切／表現良好</th><th>服務需要改善</th></tr></thead><tbody id="employeeTable"></tbody></table></div></section>
<section class="section"><h2>四、完整評價紀錄</h2><div class="toolbar"><p class="hint" id="recordCount" style="margin:0"></p><label>每頁顯示 <select id="pageSize"><option value="10">10 筆</option><option value="20">20 筆</option><option value="50">50 筆</option></select></label></div><div id="reviewRecords"></div><div class="pagination"><button id="prevPage" type="button">上一頁</button><span id="pageInfo"></span><button id="nextPage" type="button">下一頁</button></div></section>
</div>
</main>
<script>
const SUPABASE_URL="https://hssaupoqeqaxpqglfzea.supabase.co";
const SUPABASE_KEY="sb_publishable_AgzsUiJbiaV-6jrzth4ODw_nQvXJKM4";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let allReviews=[],page=1;
const serviceItems=[{label:"櫃檯人員的接待與服務態度",rating:"counter_rating",reason:"counter_reason"},{label:"場控人員的協助與應對",rating:"floor_rating",reason:"floor_reason"},{label:"其他服務人員的整體表現",rating:"staff_rating",reason:"staff_reason"}];
const environmentItems=[{label:"現場環境與舒適度",rating:"environment_rating",reason:"environment_reason"},{label:"桌布乾淨度",rating:"tablecloth_rating",reason:"tablecloth_reason"},{label:"計分牌乾淨度",rating:"chips_rating",reason:"chips_reason"},{label:"廁所整潔度",rating:"restroom_rating",reason:"restroom_reason"}];
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function validRating(v){const n=Number(v);return v!==null&&v!==undefined&&v!==""&&Number.isFinite(n)&&n>=1&&n<=5?n:null}
function average(values){return values.length?(values.reduce((a,b)=>a+b,0)/values.length).toFixed(1)+" ⭐":"—"}
function ratingSummary(key){const nums=allReviews.map(r=>validRating(r[key])).filter(n=>n!==null);return {average:average(nums),count:nums.length}}
function renderMetrics(target,items){$(target).innerHTML=items.map(item=>{const s=ratingSummary(item.rating);return `<div class="metric"><div class="metric-name">${esc(item.label)}</div><div class="metric-value">${esc(s.average)}</div><div class="metric-count">有效評分 ${s.count} 筆</div></div>`}).join("")}
function normalizeName(name){return String(name??"").trim().replace(/\s+/g," ")}
function renderEmployees(){const names=new Map();for(const r of allReviews){for(const [key,field] of [["favorite","favorite_employee_name"],["improve","improve_employee_name"]]){const name=normalizeName(r[field]);if(!name)continue;const normalized=name.toLocaleLowerCase();if(!names.has(normalized))names.set(normalized,{name,favorite:0,improve:0});names.get(normalized)[key]++}}const data=[...names.values()].sort((a,b)=>(b.favorite+b.improve)-(a.favorite+a.improve)||a.name.localeCompare(b.name,"zh-Hant"));$("employeeTable").innerHTML=data.length?data.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.favorite}</td><td>${r.improve}</td></tr>`).join(""):'<tr><td colspan="3" class="empty">目前沒有員工姓名評價。</td></tr>'}
function dateText(value){if(!value)return "";const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString("zh-TW")}
function answer(label,value,reason){const star=validRating(value);const text=star===null?"未評分":`${star} ⭐`;const detail=String(reason??"").trim();return `<div class="answer"><div class="answer-title">${esc(label)}</div>${esc(text)}${detail?`<div class="answer-detail">原因／建議：${esc(detail)}</div>`:""}</div>`}
function nameAnswer(label,name,reason){const n=String(name??"").trim(),detail=String(reason??"").trim();return `<div class="answer"><div class="answer-title">${esc(label)}</div>${n?esc(n):"未填寫"}${detail?`<div class="answer-detail">原因：${esc(detail)}</div>`:""}</div>`}
function renderRecords(){const size=Number($("pageSize").value),pages=Math.max(1,Math.ceil(allReviews.length/size));page=Math.min(Math.max(1,page),pages);$("recordCount").textContent=`共 ${allReviews.length} 筆有效評價`;const rows=allReviews.slice((page-1)*size,page*size);$("reviewRecords").innerHTML=rows.map((r,i)=>{const overall=validRating(r.overall_rating);const answers=[...serviceItems,...environmentItems].map(item=>answer(item.label,r[item.rating],r[item.reason])).join("");const extra=String(r.improvement_comment??"").trim();return `<article class="review"><div class="review-head"><span>第 ${(page-1)*size+i+1} 筆｜整體滿意度：${overall===null?"未評分":overall+" ⭐"}</span><span class="review-date">${esc(dateText(r.created_at))}</span></div><div class="review-grid">${answers}${nameAnswer("服務親切／表現良好的員工",r.favorite_employee_name,r.favorite_employee_reason)}${nameAnswer("服務需要改善的員工",r.improve_employee_name,r.improve_employee_reason)}<div class="answer"><div class="answer-title">其他建議</div>${extra?esc(extra):"未填寫"}</div></div></article>`}).join("")||'<p class="empty">目前沒有有效評價。</p>';$("pageInfo").textContent=`第 ${page} / ${pages} 頁`;$("prevPage").disabled=page<=1;$("nextPage").disabled=page>=pages}
function renderDashboard(){const ratings=allReviews.map(r=>validRating(r.overall_rating)).filter(n=>n!==null);$("totalReviews").textContent=allReviews.length;$("averageRating").textContent=average(ratings);$("commentCount").textContent=allReviews.filter(r=>String(r.improvement_comment??"").trim()).length;renderMetrics("serviceMetrics",serviceItems);renderMetrics("environmentMetrics",environmentItems);renderEmployees();renderRecords()}
async function loadDashboard(){$("loading").style.display="block";$("loading").textContent="資料讀取中...";$("dashboard").style.display="none";try{const rows=[];const batch=1000;for(let from=0;from<100000;from+=batch){const {data,error}=await client.from("reviews").select("*").eq("is_valid",true).order("created_at",{ascending:false}).range(from,from+batch-1);if(error)throw error;rows.push(...(data||[]));if(!data||data.length<batch)break}allReviews=rows;page=1;renderDashboard();$("loading").style.display="none";$("dashboard").style.display="block"}catch(e){console.error(e);$("loading").textContent="讀取資料失敗："+(e.message||String(e))}}
function showLoggedIn(){$("loginBox").style.display="none";$("logoutButton").style.display="inline-block";loadDashboard()}
function showLoggedOut(){$("loginBox").style.display="block";$("logoutButton").style.display="none";$("loading").style.display="none";$("dashboard").style.display="none";$("loginPassword").value=""}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("loginEmail").value.trim(),password=$("loginPassword").value,btn=$("loginButton");$("loginError").textContent="";btn.disabled=true;btn.textContent="登入中...";try{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;showLoggedIn()}catch(err){$("loginError").textContent="登入失敗，請檢查帳號與密碼。"}finally{btn.disabled=false;btn.textContent="登入管理後台"}});
$("logoutButton").addEventListener("click",async()=>{const {error}=await client.auth.signOut();if(error){alert("登出失敗，請再試一次。");return}showLoggedOut()});
$("pageSize").addEventListener("change",()=>{page=1;renderRecords()});$("prevPage").addEventListener("click",()=>{page--;renderRecords()});$("nextPage").addEventListener("click",()=>{page++;renderRecords()});
(async()=>{try{const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)showLoggedIn();else showLoggedOut()}catch(e){showLoggedOut();$("loginError").textContent="登入狀態檢查失敗，請重新登入。"}})();
</script>
</body>
</html>
